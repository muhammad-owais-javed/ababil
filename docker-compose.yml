name: ababil

services:
  ollama-engine:
    image: ollama/ollama:${OLLAMA_VERSION:?set OLLAMA_VERSION in .env}
    container_name: ollama-service
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  model-puller:
    image: ollama/ollama:${OLLAMA_VERSION:?set OLLAMA_VERSION in .env}
    container_name: model-puller
    environment:
      - OLLAMA_HOST=ollama-engine:11434
      - LLM_MODELS=${LLM_MODELS:?set LLM_MODELS in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'for m in $$(echo "$$LLM_MODELS" | tr "," " "); do echo "Pulling $$m"; ollama pull "$$m" || exit 1; done'
    depends_on:
      ollama-engine:
        condition: service_healthy
    restart: "no"
  sandbox:
    build: ./sandbox
    container_name: sandbox-service
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:?set VNC_PASSWORD in .env}
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      - SCREEN_SIZE=1280x800
    ports:
      - "127.0.0.1:6080:6080"   # viewer, this machine only
    expose:
      - "8001"                  # API, reachable only inside the Docker network
    volumes:
      - sandbox_home:/root     # files and installs survive container restarts
    shm_size: "512m"
    mem_limit: 3g
    cpus: 4
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: agent-service
    environment:
      - OLLAMA_URL=http://ollama-engine:11434
      - LLM_MODELS=${LLM_MODELS:?set LLM_MODELS in .env}
      - SANDBOX_URL=http://sandbox-service:8001
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
    ports:
      - "127.0.0.1:8080:8080"   # watch page and task input, this machine only
    depends_on:
      ollama-engine:
        condition: service_healthy
      sandbox:
        condition: service_started
    restart: unless-stopped
    
volumes:
  ollama_data:
  sandbox_home: